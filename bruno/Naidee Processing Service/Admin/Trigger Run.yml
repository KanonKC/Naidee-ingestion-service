info:
  name: Trigger Run
  type: http
  seq: 1

http:
  method: POST
  url: "{{Base_URL}}/admin/runs"
  headers:
    - name: x-api-key
      value: "{{Admin_Api_Key}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // 202 and 409 both carry a run_id — the new run, or the one already in
        // the way. Either is what you want to poll next, so capture both.
        const data = res.getBody();

        if (data && data.run_id) {
          bru.setEnvVar("Run_Id", String(data.run_id));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
