info:
  name: Trigger Run - Missing Token
  type: http
  seq: 3

http:
  method: POST
  url: "{{Base_URL}}/admin/runs"
  headers:
    # Deliberately empty. The admin routes must refuse an unauthenticated
    # caller, and this is how you check that they still do — a 401 here is the
    # pass, anything else means the guard has come loose.
    - name: X-Admin-Token
      value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
