info:
  name: Check Instagram Scope
  type: http
  seq: 3

http:
  method: GET
  url: https://graph.facebook.com/v25.0/:ig_account_id?fields=business_discovery.username({{IG_Account_Username}}){id,username,media_count}
  headers:
    - name: Authorization
      value: "Bearer "
  params:
    - name: fields
      value: business_discovery.username({{IG_Account_Username}}){id,username,media_count}
      type: query
    - name: ig_account_id
      value: "{{IG_Account_ID}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
