info:
  name: Trigger Run - Missing Key
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8083/admin/runs
  headers:
    # Deliberately empty. The admin routes must refuse an unauthenticated
    # caller, and this is how you check that they still do — a 401 here is the
    # pass, anything else means the guard has come loose.
    - name: x-api-key
      value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
