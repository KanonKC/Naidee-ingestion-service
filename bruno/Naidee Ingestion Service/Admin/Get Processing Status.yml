info:
  name: Get Processing Status
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8082/api/v1/admin/processing/runs/{{Run_Id}}
  headers:
    - name: x-api-key
      value: "{{Admin_Api_Key}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
